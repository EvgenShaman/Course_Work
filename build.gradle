plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.6'
	id 'io.spring.dependency-management' version '1.1.0'
	id 'jacoco'                           // для покрытия тестов
	id 'org.sonarqube' version '4.4.1.3373'  // плагин SonarQube/SonarCloud

}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation platform('org.junit:junit-bom:5.10.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport          // генерируем отчёт после тестов
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true               // SonarCloud требует XML
		html.required = true
	}
}

sonarqube {
	properties {
		property "sonar.projectKey", "EvgenShaman_Course_Work"
		property "sonar.organization", "EvgenShaman"
		property "sonar.host.url", "https://sonarcloud.io"
		property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.java.source", "11"
		property "sonar.sourceEncoding", "UTF-8"
	}
}


tasks.named('test') {
	useJUnitPlatform()
}
