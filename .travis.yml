language: java
jdk: openjdk17  # Минимальная версия для SonarCloud Scanner

addons:
  sonarcloud:
    organization: "ваш_organization_key"  # Ключ организации из SonarCloud
    token: $SONAR_TOKEN                   # Зашифрованная переменная из Travis CI

script:
  # Команда для Maven: сборка, тесты и анализ SonarCloud
  - mvn clean verify sonar:sonar -Pcoverage